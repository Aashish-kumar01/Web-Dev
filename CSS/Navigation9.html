<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <style>
        .navbar{
            background-color: #af81df;
            border-radius: 32px;
        }
        .navbar ul{
            overflow: auto;
        }
        .navbar li{
            border: 3px solid black;
            border-radius: 18px;
            float: left;
            list-style: none;
            padding: 6px 18px;
            margin: 4px 4px;
            padding-top: 6px;
        }
        .navbar li:hover{
            background-color: azure;
        }
        .navbar li a{
            text-decoration: none;
        }
        .search{
            float: right;
            padding: 9px 39px;
        }
        .navbar input{
            border: 2px solid black;
            border-radius: 8px;
            padding: 3px;
            text-align: center;
        }
    </style>
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Services</a></li>
                <li><a href="">Contact us</a></li>   
                <div class="search">
                    <input type="text" name="search" id="search" placeholder="Search this website">
                </div>
            </ul>
        </nav>
    </header>
</body>
</html>
