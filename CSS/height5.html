<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height, width, borders and background</title> 
    <style>
        #firstpara{
            background-color: red;  
            height: 100px;
            width: 455px;
            border: 4px solid green;
            /*border-width: 4px;
            border-color: green;
            border-style: solid;*/
            border-radius: 11px;
        }
        #secondpara{
            background-color: rgb(59, 251, 0);  
            height: 100px;
            width: 200px;
            border-top: 4px solid rgb(212, 14, 242);
            border-right: 2px solid rgb(18,10,133);
            border-bottom: 2px solid rgb(9, 144, 27, 0.774);
            border-left: 2px solid rgb(156, 42, 13);
            border-top-left-radius: 4px;
            border-top-right-radius: 14px;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 24px;
        }
        #thirdpara{
            height: 150px;
            width: 600px;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/Official_CSS_Logo.svg/1200px-Official_CSS_Logo.svg.png');
            border: 2px solid red;
            background-size: 50px;
            background-repeat: no-repeat;/* repeat-x and repeat-y will repeat on x and y axis*/
            /* background-position: center center; */
            /* background-position: 192px 34px; */
            background-position: top center;
            /* background-position: bottom right; */


        }
    </style>
</head>
<body>
    <h3>This is heading</h3>
    <p id="firstpara">This is a paragraph</p>
    <h3>This is second heading</h3>
    <p id="secondpara">This is a my second paragraph</p>
    <h3>This is third heading</h3>
    <p id="thirdpara">This is a my third paragraph</p>
    
</body>
</html>
