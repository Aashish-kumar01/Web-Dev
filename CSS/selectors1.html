<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css selectors</title>
</head>
<style>
    /* Element selector */
    p{
        border: 2px solid red;
    }
    /* id selector */
    #redelement{
        color: blue;
    }
    /* class selector */
    .redgoat{
        color: blueviolet;
    }
    .bgblue{
        background: yellow;
    }
    /* groouping selector */
    footer, span{
    color: aqua;
    background-color: burlywood;
    }
</style>
<body>
    <h3>css selectors</h3>
    <p>
        This is a simple paragraph tp dempnstrate css selctors
    </p>
    <p id="redelement">
        This is a another simple paragraph tp dempnstrate css selctors
    </p>
    <div>
        <p id="shield" class="redgoat bgblue">
        This is a yet another simple paragraph tp dempnstrate css selctors
        </p>
    </div>
    <span>This is span</span>
    <footer>This is Footer</footer>
</body>
</html>
