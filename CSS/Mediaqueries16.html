<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        .box{ 
             font-size: 30px;
             text-align: center;
            background-color: red;
            color: white;
            display: none;
        }
        @media only screen and (max-width:300px){
            #box-1{ 
                display: block;
                background-color: violet;
            }
        }
        @media only screen and (max-width:500px) and (min-width: 300px){
            #box-2{ 
                display: block;
                background-color: aqua;
                color: black;
            }
        }
        @media only screen and (max-width:650px) and (min-width: 200px){
            #box-3{ 
                display: block;
                background-color: blue
            }
        }
        @media only screen and (max-width:100em){
            #box-4{ 
                display: block;
                background-color: green;
            }
        }
        </style>
</head>
<body>
    <div class="box" id="box-1">Mai ek iphone hoon</div>
    <div class="box" id="box-2">Mai ek Tablet hoon</div>
    <div class="box" id="box-3"> Mai ek  desktop computer hoon</div>
    <div class="box" id="box-4">Mai ek widescreen computer hoon</div>
    
</body>
</html>
