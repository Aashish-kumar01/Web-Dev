<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo selectors & more designing</title>
    <style>
        .container{
            border: 2px solid red;
            background-color: aqua;
            padding: 34px;
            margin: 34px auto;
            width: 666px;
         }
         .btn{
            background-color: rgb(181, 225, 24);
            padding: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            border-radius: 4px;
         }
         a{
            text-decoration:none ;
            color: black;
         }
        
         a:hover{
            color: rgb(255, 230, 0);
            background-color: rgb(0, 21, 255);
            border: 2px solid black;
         }
         a:visited{
            background-color: blueviolet;
         }
         a:active{
            background-color: rgb(66, 84, 161);
         }
         .btn:hover{
            background-color: brown;
            border: 2px solid black;
         }
         .cla{
            background-color: rgb(181, 225, 24);
            padding: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            border-radius: 4px;
         }

    </style>
</head>
<body>
    <div class="container" id="cont1">
        <h3>This is my heading</h3>
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Asperiores eaque, expedita libero ipsa facere, ipsam sequi voluptatem tempore debitis vel, deserunt magni repudiandae! Dolorem nemo autem sapiente sequi repellat cupiditate?</p>
        <a href="https://google.com" class="cla">Read more</a>
        <button class="btn">Contact us</button>
    </div>
    
</body>
</html>
